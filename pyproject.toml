[project]
name = "zxing-cpp-sr"
version = "0.1.0"
description = "ZXing-C++ QR decoder wrapper with deterministic upscale/SR retry variants"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "zxing-cpp>=3.0",
]

[project.scripts]
zxing-cpp-sr = "zxing_cpp_sr.decoder:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zxing_cpp_sr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
